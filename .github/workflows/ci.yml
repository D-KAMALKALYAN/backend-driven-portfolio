name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The Supabase client is typed with the generated Database schema, so a
      # query against a table or column that does not exist is a compile
      # error. This replaced the regex grep for stale table names that used
      # to live below - five production bugs were this class of mistake.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # No .env in CI. These are syntactically valid placeholders, not
          # secrets - no test makes a network call. Their presence also keeps
          # the run honest: it exercises the same code path as production
          # rather than a special test-only branch.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      # Every route renders per request, so `next build` needs no database:
      # nothing is fetched at build time. If this step ever starts needing
      # real credentials, something has become static that should not be.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: Fail if a fabricated metric reappears
        run: |
          if grep -rn "99\.9%" src/ --include=*.tsx | grep -v "^\s*//" | grep -v "'Uptime: 99.9%'"; then
            echo "::error::Hardcoded uptime figure found - see ADR-011"
            exit 1
          fi
          echo "OK - no fabricated uptime metric"
