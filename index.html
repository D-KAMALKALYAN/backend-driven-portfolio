    <script>
      // Prevent theme flicker — set data-theme before React hydrates
      (function(){try{var t=localStorage.getItem('elite-portfolio-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t)}else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches){document.documentElement.setAttribute('data-theme','light')}}catch(e){}})();
    </script>
